<!doctype html>
<!-- Declare the page language for browsers and screen readers. -->
<html lang="en">
<head>
    <!-- Decode text and symbols as UTF-8. -->
    <meta charset="utf-8">
    <!-- Scale the layout to the device width. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Name the browser tab. -->
    <title>Regex Onboarding Hackathon</title>
    <!-- Load the page styles from Flask's static directory. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <!-- Wait for the document to parse before wiring its controls. -->
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
    <!-- Keep the heading, controls, and results within the same readable width. -->
    <main class="workspace">
        <!-- Introduce the assignment and the two available actions. -->
        <header class="intro">
            <!-- Associate the project with its assignment. -->
            <p class="course"><span aria-hidden="true">/.*/</span> ALCHE Formative One</p>
            <!-- Provide the page's main heading. -->
            <h1>Regex Onboarding Hackathon</h1>
            <!-- Distinguish the two actions before users enter text. -->
            <p class="intro-copy">Validate a single value or extract matches from a block of text.</p>
        </header>
        <!-- Lay out the form and results side by side when space permits. -->
        <div class="panels">
            <!-- Give JavaScript the endpoint generated by Flask. -->
            <form class="panel" id="analyzer" data-endpoint="{{ url_for('analyze') }}" novalidate>
                <!-- Identify the form's purpose. -->
                <h2>Analyze text</h2>
                <!-- Associate the category label with its control. -->
                <label for="category">Category</label>
                <!-- Use the same category keys accepted by the API. -->
                <select id="category" name="category">
                    {# Render the five category options in display order. #}
                    {% for key, label in categories.items() %}
                    <!-- Display the friendly category name and submit its API key. -->
                    <option value="{{ key }}">{{ label }}</option>
                    {% endfor %}
                </select>
                <!-- Keep the example action beside the input label. -->
                <div class="input-heading">
                    <!-- Name the text area for keyboard and screen reader users. -->
                    <label for="source">Input text</label>
                    <!-- Fill the text area without submitting the form. -->
                    <button class="example" id="example" type="button">Try example</button>
                </div>
                <!-- Accept multiline text and leave its spelling untouched. -->
                <textarea id="source" name="text" rows="8" spellcheck="false" required placeholder="Type or paste your text here…"></textarea>
                <!-- Use native submit buttons so both actions work from the keyboard. -->
                <div class="actions">
                    <!-- Search the text for every matching value. -->
                    <button class="primary" type="submit" name="action" value="extract">Extract</button>
                    <!-- Check the whole value against the selected category. -->
                    <button class="secondary" type="submit" name="action" value="validate">Validate</button>
                </div>
                <!-- Explain the browser requirement if scripts are disabled. -->
                <noscript><p>Enable JavaScript to submit text for analysis.</p></noscript>
            </form>
            <!-- Label the results region independently of the form. -->
            <section class="panel results" aria-labelledby="results-title">
                <!-- Give the results region a visible heading. -->
                <h2 id="results-title">Results</h2>
                <!-- Announce status, validation outcomes, counts, and errors. -->
                <p id="status" class="status" role="status">Choose a category and enter text to get started.</p>
                <!-- Insert result elements here after a successful extraction. -->
                <div id="result-content"></div>
            </section>
        </div>
    </main>
</body>
</html>
